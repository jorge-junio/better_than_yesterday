<aside class="workout-rest-timer card border-info shadow-lg" data-rest-timer data-session-id="{{ session.pk }}" hidden aria-label="Descanso entre séries">
  <div class="card-body">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
      <h2 class="h6 mb-0">Descanso entre séries</h2>
      <span class="small text-body-secondary">{{ session.rest_seconds }} segundos</span>
    </div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 my-2">
      <span class="workout-rest-time" data-rest-time role="timer" aria-live="off">00:00</span>
      <button type="button" class="btn btn-outline-info" data-rest-dismiss title="Pular descanso">Pular descanso</button>
    </div>
    <div class="progress mb-2" style="height: 6px;"><div class="progress-bar bg-info" data-rest-progress role="progressbar" aria-label="Tempo de descanso restante" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" style="width: 100%;"></div></div>
    <p class="small mb-0" data-rest-status role="status" aria-live="polite">Descansando…</p>
  </div>
</aside>
