<div data-page-title="{{ page_title }}" data-shopping-section="{{ shopping_section }}">
  <div class="mx-auto" style="max-width: 640px;">
    <h1 class="h3 mb-4">{{ heading }}</h1>
    {% if description %}<p>{{ description }}</p>{% endif %}
    <div class="card shadow-sm"><div class="card-body">
      <form method="post" action="{{ request.path }}">
        {% csrf_token %}
        {% include 'shopping/partials/fields.html' %}
        <div class="d-flex flex-wrap gap-2 mt-4">
          <button type="submit" class="btn btn-primary" title="{{ submit_label }}">{{ submit_label }}</button>
          <a href="{{ cancel_url }}" class="btn btn-outline-secondary" title="Cancelar">Cancelar</a>
        </div>
      </form>
    </div></div>
  </div>
</div>
