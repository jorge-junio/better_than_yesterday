<div data-page-title="{{ page_title }}" data-shopping-section="wishes">
  {% include 'shopping/partials/back_link.html' %}
  <h1 class="mb-3">Excluir compra desejada</h1>
  <div class="panel card-body"><p>Tem certeza que deseja excluir <strong>{{ wish.name }}</strong>?</p>
    <form method="post" action="{{ request.path }}" class="mt-3 d-flex justify-content-between">{% csrf_token %}
      <button type="submit" class="btn btn-danger" style="flex: 0 0 49%;" title="Excluir">Excluir</button>
      <a class="btn btn-secondary" style="flex: 0 0 49%;" href="{% url 'purchase_wish_list' %}" title="Cancelar">Cancelar</a>
    </form>
  </div>
</div>
