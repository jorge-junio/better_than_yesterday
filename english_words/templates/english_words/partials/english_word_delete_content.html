<div data-page-title="{{ page_title }}">
<div class="container mt-4">
    <h3 class="display-6">Excluir Palavra em Inglês</h3>
    <div class="card border-danger">
        <div class="card-body">
            <p class="mb-0">Tem certeza que deseja excluir <strong>{{ object.word }}</strong>?</p>
            {% if object.note %}
            <p class="text-muted mt-2 mb-0">{{ object.note }}</p>
            {% endif %}
        </div>
    </div>
    <form method="post" action="{{ request.path }}" class="mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger" title="Excluir">Excluir</button>
        <a href="{{ cancel_url }}" class="btn btn-secondary ms-2" title="Cancelar">Cancelar</a>
    </form>
</div>
</div>
