<div data-page-title="{{ page_title }}">
<div class="container mt-4">
    <h3 class="display-6">Deletar Tarefa Recorrente</h3>
    <div class="card">
        <div class="card-body">
            <p class="card-text">Tem certeza que deseja excluir a tarefa recorrente <strong>{{ object.name }}</strong>?</p>

            <form method="post" action="{% url 'recurring_task_delete' object.id %}">
                {% csrf_token %}
                <div class="d-flex flex-nowrap justify-content-between mt-3">
                    <button type="submit" class="btn btn-danger" style="flex: 0 0 49%;" title="Excluir">Excluir</button>
                    <a href="{{ cancel_url }}" class="btn btn-secondary" style="flex: 0 0 49%;" title="Cancelar">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
