<a id="recurring-task-row-{{ recurring_task.id }}" class="recurring-task-card" href="{% url 'recurring_task_detail' recurring_task.id %}" title="Ver detalhes de {{ recurring_task.name }}">
    <span class="recurring-task-name">{{ recurring_task.name }}</span>
    {% if recurring_task.is_active %}<span class="badge text-bg-success">Ativa</span>{% else %}<span class="badge text-bg-secondary">Inativa</span>{% endif %}
</a>
