<div data-page-title="{{ page_title }}">
<div class="container mt-4">
    <h3 class="display-6">Excluir Categoria</h3>
    <div class="card">
        <div class="card-body">
            <p class="mb-0">Tem certeza que deseja excluir a categoria <strong>{{ object.name }}</strong>?</p>
            <form method="post" action="{% url 'category_delete' object.id %}" class="mt-3 d-flex flex-nowrap justify-content-between">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger" style="flex: 0 0 49%;" title="Excluir categoria">Excluir</button>
                <a href="{{ cancel_url }}" class="btn btn-secondary" style="flex: 0 0 49%;" title="Cancelar">
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</div>
</div>
